<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>出勤簿</title>
    
    <!-- アイコン・マニフェストを自動生成 (単一ファイルでPWA化) -->
    <script>
        (function() {
            // アイコンをCanvasで動的に生成 (PNG形式)して確実に表示させる
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            // 1. ピンクの背景
            ctx.fillStyle = '#E8A0B8';
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(0, 0, 512, 512, 120);
            else ctx.rect(0, 0, 512, 512);
            ctx.fill();
            
            // 2. クリップ部分（上部）
            ctx.fillStyle = '#a3a3a3';
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(190, 106, 132, 70, 16);
            else ctx.rect(190, 106, 132, 70);
            ctx.fill();
            
            // 3. クリップの穴
            ctx.fillStyle = '#E8A0B8';
            ctx.beginPath();
            ctx.arc(256, 126, 14, 0, Math.PI * 2);
            ctx.fill();
            
            // 4. バインダーの紙部分
            ctx.fillStyle = '#FBEBF0';
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(116, 156, 280, 280, 16);
            else ctx.rect(116, 156, 280, 280);
            ctx.fill();
            
            // 5. 時計の枠線
            ctx.strokeStyle = '#E8A0B8';
            ctx.lineWidth = 14;
            ctx.beginPath();
            ctx.arc(256, 296, 76, 0, Math.PI * 2);
            ctx.stroke();
            
            // 6. 時計の針
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(256, 246);
            ctx.lineTo(256, 296);
            ctx.lineTo(286, 326);
            ctx.stroke();

            const iconDataUrl = canvas.toDataURL('image/png');

            // マニフェストの生成と適用
            const manifest = {
                name: "出勤簿",
                short_name: "出勤簿",
                start_url: location.href.split('?')[0].split('#')[0],
                display: "standalone",
                background_color: "#FFF6F6",
                theme_color: "#E8A0B8",
                icons: [{
                    src: iconDataUrl,
                    sizes: "512x512",
                    type: "image/png",
                    purpose: "any maskable"
                }]
            };
            const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = URL.createObjectURL(blob);
            document.head.appendChild(link);
        })();
    </script>
    <style>
        /* =========================================
           BHV記録アプリ風のカスタムデザイン
        ========================================= */
        :root {
            --primary: #E8A0B8; 
            --primary-dark: #D487A0; 
            --primary-light: #FBEBF0; 
            --bg-main: #ffffff; 
            --bg-sub: #FFF6F6; 
            --text-main: #5C4B51; 
            --text-muted: #8E7A82; 
            --border-color: #F0D5D8; 
            --sky: #38bdf8;
            --sky-light: #e0f2fe;
            --orange: #fb923c;
            --orange-light: #ffedd5;
            --danger: #ef4444;
            --green: #10b981;
            --radius: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
            background-color: var(--bg-sub);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            letter-spacing: 0.04em;
        }

        input[type="text"] {
            -webkit-user-select: auto;
            -moz-user-select: auto;
            -ms-user-select: auto;
            user-select: auto;
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(200, 150, 150, 0.2);
            z-index: 10;
        }
        header h1 { font-size: 2.5rem; font-weight: bold; display: flex; align-items: center; gap: 0.8rem; }
        .header-time { text-align: right; }
        .header-time .date { font-size: 1.2rem; opacity: 0.9; font-weight: bold; margin-bottom: 0.2rem; }
        .header-time .time { font-size: 2.8rem; font-weight: 900; letter-spacing: 3px; line-height: 1; }

        main {
            display: flex;
            flex: 1;
            padding: 1rem 1.5rem;
            gap: 1.5rem;
            overflow: hidden;
            max-width: 1920px;
            margin: 0 auto;
            width: 100%;
            height: calc(100vh - 85px);
        }

        .left-area {
            flex: 4.5;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow: hidden; 
            height: 100%;
        }
        .right-area { flex: 5.5; display: flex; flex-direction: column; min-width: 0; height: 100%; }

        .pane {
            background-color: var(--bg-main);
            border-radius: var(--radius);
            border: 3px solid var(--border-color);
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 15px -3px rgba(200, 150, 150, 0.1);
            overflow: hidden;
        }
        .pane-flex { flex: 1; min-height: 0; }

        .pane-header {
            background-color: var(--primary-light);
            color: var(--primary-dark);
            font-weight: bold;
            font-size: 1.25rem;
            padding: 0.75rem 1.25rem;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            white-space: nowrap; 
            overflow-x: auto; 
            gap: 1rem; 
        }
        .pane-header::-webkit-scrollbar { display: none; }
        .pane-header { -ms-overflow-style: none; scrollbar-width: none; }

        .pane-body {
            padding: 1rem 1.25rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            min-height: 0;
        }

        .select-group { display: flex; flex-direction: column; gap: 0.75rem; }
        .large-select-btn {
            width: 100%; height: clamp(45px, 6vh, 60px);
            font-size: clamp(0.95rem, 1.8vw, 1.3rem); font-weight: bold;
            border: 3px solid var(--border-color); border-radius: 12px;
            background-color: var(--primary-light); color: var(--text-main);
            text-align: center; cursor: pointer; outline: none; transition: 0.2s;
            display: flex; justify-content: center; align-items: center; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 1rem;
        }
        .large-select-btn:disabled {
            background-color: #f1f5f9; color: #94a3b8; border-color: #e2e8f0; cursor: not-allowed;
        }
        .large-select-btn:not(:disabled):active { transform: scale(0.98); }

        .list-select-btn {
            width: 100%; padding: 1.2rem; font-size: clamp(1.2rem, 3vw, 1.5rem); font-weight: bold;
            background: white; border: 2px solid var(--border-color); border-radius: 8px;
            color: var(--text-main); cursor: pointer; transition: 0.2s; text-align: center;
        }
        .list-select-btn:active { background: var(--primary-light); transform: scale(0.98); }

        .div-toggle {
            display: flex; gap: 0.75rem;
            background-color: #f8f9fa; padding: 0.4rem;
            border-radius: 14px; border: 2px solid #e9ecef;
            flex-shrink: 0;
        }
        .div-btn {
            flex: 1; height: clamp(48px, 7vh, 65px); border-radius: 10px;
            font-size: clamp(1.1rem, 2vw, 1.5rem); font-weight: bold; border: 3px solid transparent;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; text-align: center;
            background: white; color: var(--text-muted); transition: 0.2s;
        }
        .div-btn.active-am { color: var(--sky); border-color: var(--sky-light); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .div-btn.active-pm { color: var(--orange); border-color: var(--orange-light); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }

        .punch-buttons { display: flex; gap: 1rem; margin-top: auto; flex: 1; align-items: stretch; max-height: 140px; }
        .punch-btn {
            flex: 1; min-height: 75px; border-radius: 24px;
            font-size: clamp(1.3rem, 2.5vw, 2rem); font-weight: bold; color: white; border: none; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5rem; text-align: center;
            transition: 0.2s; box-shadow: 0 8px 15px rgba(0,0,0,0.15);
        }
        .punch-btn span.icon { font-size: clamp(1.6rem, 3.5vw, 2.6rem); }
        .punch-btn:disabled { background: #e2e8f0; color: #94a3b8; box-shadow: none; cursor: not-allowed; }
        .punch-btn:not(:disabled):active { transform: scale(0.95); }
        
        .btn-in-am { background: var(--sky); }
        .btn-out-am { background: #3b82f6; } 
        .btn-in-pm { background: var(--orange); }
        .btn-out-pm { background: #ea580c; }

        .btn {
            background-color: var(--primary); color: white; border: none; padding: 0.8rem 1.5rem;
            border-radius: 8px; font-size: 1.2rem; font-weight: bold; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; transition: 0.2s;
            white-space: nowrap; 
            letter-spacing: 0.05em; 
        }
        .btn-text { background: none; color: var(--text-muted); font-size: 1.1rem; border: none; cursor: pointer; font-weight: bold; white-space: nowrap; letter-spacing: 0.05em; }
        .btn-sm { padding: 0.5rem 0.8rem; font-size: 1.05rem; border-radius: 6px; white-space: nowrap; letter-spacing: 0.05em; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(92, 75, 81, 0.7); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; visibility: hidden; opacity: 0; transition: 0.1s;
        }
        .modal-overlay.show { visibility: visible; opacity: 1; }
        
        .modal-content {
            background: white; border-radius: 24px; padding: 3rem; width: 90%; max-width: 550px;
            text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); border: 4px solid var(--border-color);
            transform: translateY(20px) scale(0.95); transition: 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .modal-overlay.show .modal-content { transform: translateY(0) scale(1); }

        .time-adjust-row { display: flex; justify-content: center; align-items: center; gap: 2rem; margin: 2.5rem 0; }
        .time-adjust-btn {
            width: 80px; height: 80px; border-radius: 50%; border: none; font-size: 1.8rem; font-weight: bold;
            background: var(--primary-light); color: var(--primary-dark); cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.2s;
        }
        .time-adjust-btn:active { transform: scale(0.9); }
        .modal-time-text { font-size: 5rem; font-weight: bold; font-family: monospace; color: var(--text-main); }
        
        .modal-actions { display: flex; gap: 1.5rem; margin-top: 2rem; }
        .modal-actions button { flex: 1; padding: 1.5rem 1rem; font-size: clamp(1.2rem, 3vw, 1.6rem); border-radius: 16px; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; white-space: nowrap; }
        .btn-cancel { background: #e2e8f0; color: var(--text-main); }
        .btn-commit { background: var(--primary-dark); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .modal-actions button:active { transform: scale(0.95); }

        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 1rem; text-align: center; border-bottom: 2px solid var(--primary-light); font-size: 1.3rem; white-space: nowrap; vertical-align: middle; letter-spacing: 0.03em; }
        th { background: var(--primary-light); color: var(--primary-dark); position: sticky; top: 0; z-index: 10; font-weight: bold; }
        tbody tr:hover { background-color: var(--primary-light); }
        .badge { padding: 0.4rem 1rem; border-radius: 20px; font-weight: bold; font-size: 1.1rem; border: 2px solid; }
        .badge-am { background: var(--sky-light); color: #0284c7; border-color: #bae6fd; }
        .badge-pm { background: var(--orange-light); color: #c2410c; border-color: #fed7aa; }

        .custom-checkbox { width: 24px; height: 24px; cursor: pointer; accent-color: var(--primary); }
        th .custom-checkbox, td .custom-checkbox { transform: translateY(4px); }
        
        .emp-label { display: flex; align-items: center; gap: 1rem; padding: 1rem; border: 2px solid var(--border-color); border-radius: 8px; font-size: 1.3rem; font-weight: bold; background: white; cursor: pointer; transition: 0.2s; }
        .emp-label:active { background: var(--primary-light); }
        
        .action-btn { padding: 0.4rem 0.8rem; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; color: white; margin: 0 0.2rem; font-size: 1rem; }
        .btn-edit { background: var(--sky); }
        .btn-delete { background: var(--danger); }

        #toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background-color: var(--text-main); color: white; padding: 16px 32px; font-weight: bold; font-size: clamp(1.1rem, 3vw, 1.5rem);
            border-radius: 40px; opacity: 0; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 2000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; pointer-events: none;
            display: flex; align-items: center; gap: 1rem; white-space: nowrap;
        }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        .manage-modal-content { max-width: 800px; height: 85vh; display: flex; flex-direction: column; padding: 2rem; }
        .manage-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .manage-form { display: flex; gap: 1rem; background: var(--bg-sub); padding: 1.5rem; border-radius: 12px; margin-bottom: 1rem; flex-wrap: wrap; transition: 0.3s; }
        
        @keyframes highlightFlash {
            0% { box-shadow: 0 0 0 4px var(--primary); background-color: var(--primary-light); }
            100% { box-shadow: 0 0 0 0 transparent; background-color: var(--bg-sub); }
        }
        .highlight-flash { animation: highlightFlash 3s ease-out; }

        .manage-form input, .manage-form .manage-category-btn { flex: 1; padding: 0.8rem; border: 2px solid var(--border-color); border-radius: 8px; font-size: 1.1rem; min-width: 150px; background-color: white; transition: 0.2s; text-align: center; }
        .manage-form input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
        .manage-category-btn { color: var(--text-main); text-align: center; cursor: pointer; }
        .manage-table-container { flex: 1; overflow-y: auto; border: 2px solid var(--border-color); border-radius: 12px; }
        .manage-table-container th { position: sticky; top: 0; background: var(--primary-light); }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        
        .svg-icon {
            width: 1.2em;
            height: 1.2em;
            vertical-align: -0.2em;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            display: inline-block;
        }
        .flex-center {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }
    </style>
</head>

                const CACHE_NAME = 'attendance-app-v3';
                self.addEventListener('install', e => {
                    e.waitUntil(caches.open(CACHE_NAME).then(cache => cache.add(location.href.split('?')[0])));
                    self.skipWaiting();
                });
                self.addEventListener('activate', e => {
                    e.waitUntil(caches.keys().then(keys => Promise.all(keys.map(k => k !== CACHE_NAME ? caches.delete(k) : null))));
                    clients.claim();
                });
                self.addEventListener('fetch', e => {
                    e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
                });

        function renderCategories() {

            employeeBtn.disabled = false;
            const empList = document.getElementById('employee-list');
            empList.innerHTML = '';

                    empList.appendChild(label);
                });
            }
            closeCategoryModal();
            updatePunchButtonsState();
        }

        function updateSelectedEmployeesText() {
            const checkboxes = document.querySelectorAll('.emp-checkbox:checked');
            const count = checkboxes.length;
            if (count === 1) { employeeBtn.textContent = checkboxes[0].value; } 
            else if (count > 1) { employeeBtn.textContent = `${checkboxes[0].value} ほか ${count - 1}名`; } 
            else { employeeBtn.textContent = '▼ ② 氏名を選択（複数選択可）'; }
        }

        function selectAllEmployees() {
            document.querySelectorAll('.emp-checkbox').forEach(cb => cb.checked = true);
            updateSelectedEmployeesText();
        }

        function clearAllEmployees() {
            document.querySelectorAll('.emp-checkbox').forEach(cb => cb.checked = false);
            updateSelectedEmployeesText();
        }

        function confirmEmployeeSelection() {
            const checkboxes = document.querySelectorAll('.emp-checkbox:checked');
            selectedEmployees = Array.from(checkboxes).map(cb => cb.value);
            if(selectedEmployees.length === 0) { showToast('1名以上選択してください'); return; }
            closeEmployeeModal();
            updatePunchButtonsState();
        }

            selectedDivision = div;
            document.getElementById('div-am').className = `div-btn ${div === 'AM' ? 'active-am' : ''}`;
            document.getElementById('div-pm').className = `div-btn ${div === 'PM' ? 'active-pm' : ''}`;
            updatePunchButtonsState();
        }

        function updatePunchButtonsState() {
            const btnIn = document.getElementById('btn-in');
            const btnOut = document.getElementById('btn-out');
            btnIn.className = 'punch-btn'; btnOut.className = 'punch-btn';
            if (selectedEmployees.length === 0) {
                btnIn.disabled = true; btnOut.disabled = true; return;

            btnIn.disabled = false; btnOut.disabled = false;
            if (selectedDivision === 'AM') {
                btnIn.classList.add('btn-in-am'); btnOut.classList.add('btn-out-am');
            } else {
                btnIn.classList.add('btn-in-pm'); btnOut.classList.add('btn-out-pm');
            }
        }

        function getRoundedTime(date) {
            const ms = 1000 * 60 * 5;
            return new Date(Math.round(date.getTime() / ms) * ms);
        }
        function formatTimeDisplay(date) {
            return `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
        }

            if (selectedEmployees.length === 0) return;
            pendingPunch.action = action;

            document.getElementById('modal-employee-name').textContent = namesStr;
            document.getElementById('modal-time-display').textContent = formatTimeDisplay(pendingPunch.timeObj);
            const badge = document.getElementById('modal-badge');
            
            const iconSvg = selectedDivision==='AM' ? '<svg class="svg-icon"><use href="#icon-sun"></use></svg>' : '<svg class="svg-icon"><use href="#icon-moon"></use></svg>';
            badge.innerHTML = `<span class="flex-center">${iconSvg} ${selectedDivision} - ${action==='IN'?'出勤':'退勤'}</span>`;
            
            badge.style.background = selectedDivision==='AM' ? 'var(--sky-light)' : 'var(--orange-light)';
            badge.style.color = selectedDivision==='AM' ? '#0284c7' : '#c2410c';

            punchModal.classList.add('show');
        }

        function closePunchModal() { punchModal.classList.remove('show'); }

        function adjustPunchTime(minutes) {
            pendingPunch.timeObj.setMinutes(pendingPunch.timeObj.getMinutes() + minutes);
            document.getElementById('modal-time-display').textContent = formatTimeDisplay(pendingPunch.timeObj);
        }

        function commitPunch() {
            const dateStr = `${pendingPunch.timeObj.getFullYear()}/${String(pendingPunch.timeObj.getMonth() + 1).padStart(2, '0')}/${String(pendingPunch.timeObj.getDate()).padStart(2, '0')}`;
            const timeStr = formatTimeDisplay(pendingPunch.timeObj);
            if (isBatchOutMode) {
                [...batchOutTargets].reverse().forEach((target, index) => {
                    punchHistory.unshift({
                        id: Date.now() + '-' + index + '-' + Math.floor(Math.random() * 10000),
                        name: target.name, division: target.division, action: 'OUT', date: dateStr, time: timeStr
                    });
                });
                showToast(`${batchOutTargets.length}名の退勤を記録しました`);
                document.getElementById('history-select-all').checked = false;
            } else {
                selectedEmployees.forEach((empName, index) => {
                    punchHistory.unshift({
                        id: Date.now() + '-' + index + '-' + Math.floor(Math.random() * 10000),
                        name: empName, division: selectedDivision, action: pendingPunch.action, date: dateStr, time: timeStr
                    });
                });
                showToast(`${selectedEmployees.length}名の ${pendingPunch.action==='IN'?'出勤':'退勤'}を記録しました`);
            }
            localStorage.setItem('attendanceHistoryV6', JSON.stringify(punchHistory));
            closePunchModal();
            selectedCategory = null;
            selectedEmployees = [];
            categoryBtn.textContent = '▼ ① 職種を選択';
            employeeBtn.textContent = '▼ ② 氏名を選択（先に職種を選択してください）';
            employeeBtn.disabled = true;
            updatePunchButtonsState();

        }
        
        function renderHistory() {

                            <button class="action-btn btn-delete flex-center" onclick="deleteHistory('${r.id}')" title="削除" style="margin: 0;"><svg class="svg-icon"><use href="#icon-trash"></use></svg></button>

        let toastTimeout;

            clearTimeout(toastTimeout);

        function startClock() {
            const dateEl = document.getElementById('current-date');
            const timeEl = document.getElementById('current-time');
            const days = ['日', '月', '火', '水', '木', '金', '土'];
            setInterval(() => {
                const now = new Date();
                dateEl.textContent = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 (${days[now.getDay()]})`;
                timeEl.textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
            }, 1000);
        }
        
        function downloadExcel() {
            if (punchHistory.length === 0) { showToast('出力するデータがありません'); return; }
            const latestDateStr = punchHistory[0].date;
            const parts = latestDateStr.split('/');
            const year = parseInt(parts[0]);
            const month = parseInt(parts[1]);
            const daysInMonth = new Date(year, month, 0).getDate();

            let tableHtml = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">';
            tableHtml += '<head><meta charset="UTF-8"></head><body><table border="1"><tr><th></th><th>職種</th><th>氏名</th><th>AM/PM</th>';
            for (let i = 1; i <= daysInMonth; i++) tableHtml += `<th>${i}日場所</th><th>${i}日時間</th>`;
            tableHtml += '</tr>';

            employeesData.forEach(emp => {
                let amRow = `<tr><td></td><td>${emp.category}</td><td>${emp.name}</td><td>AM</td>`;
                let pmRow = `<tr><td></td><td>${emp.category}</td><td>${emp.name}</td><td>PM</td>`;

                for (let d = 1; d <= daysInMonth; d++) {
                    const targetDateStr = `${year}/${String(month).padStart(2, '0')}/${String(d).padStart(2, '0')}`;
                    const inAm = punchHistory.find(r => r.name === emp.name && r.division === 'AM' && r.date === targetDateStr && r.action === 'IN');
                    const outAm = punchHistory.find(r => r.name === emp.name && r.division === 'AM' && r.date === targetDateStr && r.action === 'OUT');
                    let timeAm = "";
                    if (inAm && outAm) {
                        const inMins = parseInt(inAm.time.split(':')[0]) * 60 + parseInt(inAm.time.split(':')[1]);
                        const outMins = parseInt(outAm.time.split(':')[0]) * 60 + parseInt(outAm.time.split(':')[1]);
                        let diff = Math.max(0, outMins - inMins);
                        timeAm = `${Math.floor(diff / 60)}:${String(diff % 60).padStart(2, '0')}`;
                    }
                    amRow += `<td></td><td style="mso-number-format:'\\@';">${timeAm}</td>`;

                    const inPm = punchHistory.find(r => r.name === emp.name && r.division === 'PM' && r.date === targetDateStr && r.action === 'IN');
                    const outPm = punchHistory.find(r => r.name === emp.name && r.division === 'PM' && r.date === targetDateStr && r.action === 'OUT');
                    let timePm = "";
                    if (inPm && outPm) {
                        const inMins = parseInt(inPm.time.split(':')[0]) * 60 + parseInt(inPm.time.split(':')[1]);
                        const outMins = parseInt(outPm.time.split(':')[0]) * 60 + parseInt(outPm.time.split(':')[1]);
                        let diff = Math.max(0, outMins - inMins);
                        timePm = `${Math.floor(diff / 60)}:${String(diff % 60).padStart(2, '0')}`;
                    }
                    pmRow += `<td></td><td style="mso-number-format:'\\@';">${timePm}</td>`;
                }
                tableHtml += amRow + '</tr>' + pmRow + '</tr>';
            });
            tableHtml += '</table></body></html>';

            const blob = new Blob([tableHtml], { type: 'application/vnd.ms-excel;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `出勤一覧_${year}年${month}月.xls`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
            showToast('Excelファイルを出力しました');
        }

        function closeManageCategoryModal() { document.getElementById('manage-category-modal').classList.remove('show'); }

        function prepareSaveEmployee(e) {
            e.preventDefault();
            const id = document.getElementById('manage-id').value;
            const category = document.getElementById('manage-category-val').value.trim();
            const name = document.getElementById('manage-name').value.trim();
            
            if(!category) { showToast('職種を選択してください'); return; }
            if(!name) { showToast('氏名を入力してください'); return; }
            
            const titleIcon = id ? '<svg class="svg-icon" style="color:var(--sky)"><use href="#icon-edit"></use></svg> 職員を更新' : '<svg class="svg-icon" style="color:var(--primary)"><use href="#icon-plus"></use></svg> 職員を追加';
            const msg = id ? `${category} - ${name} さんの情報を更新しますか？` : `${category} - ${name} さんを新しく追加しますか？`;

            document.getElementById('save-emp-title').innerHTML = titleIcon;
            document.getElementById('save-emp-msg').textContent = msg;
            window.pendingSaveEmp = { id, category, name };
            document.getElementById('save-emp-modal').classList.add('show');
        }

        function hideSaveEmpModal() { document.getElementById('save-emp-modal').classList.remove('show'); }
        function executeSaveEmployee() {
            const { id, category, name } = window.pendingSaveEmp;
            if (id) {
                const index = employeesData.findIndex(emp => emp.id == id);
                if (index !== -1) {
                    employeesData[index] = { id: parseInt(id), category, name };
                    showToast(`${name} さんの情報を更新しました`);
                }
            } else {
                const newId = employeesData.length > 0 ? Math.max(...employeesData.map(e => e.id)) + 1 : 1;
                employeesData.push({ id: newId, category, name });
                showToast(`${name} さんを追加しました`);
            }
            localStorage.setItem('attendanceEmployeesV3', JSON.stringify(employeesData));
            renderManageList();
            resetManageForm();
            hideSaveEmpModal();
        }
        
        function editEmployee(id) {
            const emp = employeesData.find(e => e.id == id);
            if (!emp) return;
            document.getElementById('manage-id').value = emp.id;
            document.getElementById('manage-category-val').value = emp.category;
            document.getElementById('manage-category-btn').textContent = emp.category;
            document.getElementById('manage-name').value = emp.name;
            document.getElementById('manage-submit-btn').innerHTML = '<svg class="svg-icon"><use href="#icon-save"></use></svg> 更新';
            document.getElementById('manage-cancel-btn').style.display = 'inline-block';
            const form = document.getElementById('manage-form');
            form.scrollIntoView({ behavior: 'smooth', block: 'start' });
            form.classList.remove('highlight-flash');
            void form.offsetWidth;
            form.classList.add('highlight-flash');
            showToast('編集モードに切り替えました。');
        }
        
        function deleteEmployee(id) {
            const emp = employeesData.find(e => e.id == id);
            if (!emp) return;
            pendingDeleteEmpId = id;
            pendingDeleteEmpName = emp.name;
            document.getElementById('delete-emp-name').textContent = `対象: ${emp.category} - ${emp.name}`;
            document.getElementById('delete-emp-modal').classList.add('show');

        function hideDeleteEmpModal() {
            document.getElementById('delete-emp-modal').classList.remove('show');

        function executeDeleteEmployee() {
            if(!pendingDeleteEmpId) return;
            employeesData = employeesData.filter(e => e.id != pendingDeleteEmpId);
